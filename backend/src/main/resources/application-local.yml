# Activated via SPRING_PROFILES_ACTIVE=local (docker-compose default). Local-only secrets —
# never used outside a developer machine / the docker-compose stack.
spring:
  # datasource intentionally NOT overridden here — application.yml's DB_URL/DB_USERNAME/
  # DB_PASSWORD defaults already point at localhost:5432/shiftswap, and docker-compose sets
  # DB_URL explicitly to reach the "postgres" service from inside the backend container.
  flyway:
    # db/seed contains local/e2e-only test accounts (see V1001__seed_test_data.sql) — additive
    # to db/migration, only ever applied when this profile is active.
    locations: classpath:db/migration,classpath:db/seed

app:
  jwt:
    secret: local-dev-only-secret-change-me-do-not-use-in-production-0123456789
  cors:
    allowed-origin: http://localhost:5173

logging:
  level:
    com.company.hr: DEBUG
