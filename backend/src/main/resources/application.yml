spring:
  application:
    name: shiftswap-backend
  datasource:
    # Defaults let the backend run directly on the host against just-Postgres-in-Docker
    # (localhost:5432); docker-compose overrides DB_URL to the "postgres" service hostname
    # since the backend itself is containerized there — see /docker-compose.yml.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shiftswap}
    username: ${DB_USERNAME:shiftswap}
    password: ${DB_PASSWORD:shiftswap}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

# See /SPEC.md "API Contract", "Tech Stack & Rationale", and docs/adr/0003-jwt-access-refresh-auth.md
app:
  jwt:
    # Namespaced (not just JWT_SECRET) deliberately: OS environment variables outrank
    # profile-specific YAML files (application-local.yml) in Spring's property precedence, so a
    # generically-named var already set in a dev's shell for something unrelated would silently
    # win over the intended local secret with no error — found via a real WeakKeyException when
    # an ambient JWT_SECRET on a dev machine was 13 bytes.
    secret: ${SHIFTSWAP_JWT_SECRET}
    access-token-ttl-seconds: 900       # 15 minutes
    refresh-token-ttl-seconds: 604800   # 7 days
  cors:
    allowed-origin: ${FRONTEND_ORIGIN}
  swap:
    request-expiry-days: 7
  idempotency:
    record-ttl-hours: 24
  login-rate-limit:
    capacity: 5
    refill-per-minute: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
