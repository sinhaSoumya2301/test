# See /SPEC.md "Local Development": `docker compose up --build` brings up Postgres, the
# Spring Boot API, and the React app together, wired with local-only defaults.
#
# SPRING_PROFILES_ACTIVE=local activates application-local.yml, which adds db/seed to Flyway's
# locations — see backend/src/main/resources/db/seed/V1001__seed_test_data.sql — so the stack
# comes up with three ready-to-use test accounts (used by frontend/e2e/swap-flow.spec.ts).
# application-local.yml no longer hardcodes the DB host: DB_URL below (pointing at the
# `postgres` service name, as Compose's DNS resolves it) always wins over the base
# application.yml's localhost fallback, regardless of which profile is active.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shiftswap
      POSTGRES_USER: shiftswap
      POSTGRES_PASSWORD: shiftswap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftswap -d shiftswap"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/shiftswap
      DB_USERNAME: shiftswap
      DB_PASSWORD: shiftswap
      # Same intentionally-public local-dev-only value already committed in
      # backend/src/main/resources/application-local.yml — never used outside this stack.
      # Namespaced as SHIFTSWAP_JWT_SECRET (not just JWT_SECRET) — see application.yml's comment.
      SHIFTSWAP_JWT_SECRET: local-dev-only-secret-change-me-do-not-use-in-production-0123456789
      FRONTEND_ORIGIN: http://localhost:5173
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: