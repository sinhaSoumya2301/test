# Gates every PR to main (SPEC.md "Security & Vulnerability Scanning", "Testing Strategy").
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify formatting (spotless)
        working-directory: backend
        run: mvn -B -q spotless:check

      - name: Build & test (unit + Testcontainers integration)
        working-directory: backend
        run: mvn -B verify

      - name: OWASP dependency check
        working-directory: backend
        run: mvn -B org.owasp:dependency-check-maven:check

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: backend/target/dependency-check-report.html

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npx tsc -b
      - working-directory: frontend
        run: npm test
      - name: npm audit (advisory — Dependabot files the fix PRs; this just surfaces new issues fast)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
      - working-directory: frontend
        run: npm run build

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t shiftswap-backend:ci ./backend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: shiftswap-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build frontend image
        run: docker build -t shiftswap-frontend:ci ./frontend
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: shiftswap-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

  contract-tests:
    name: Consumer-driven contract tests (Pact)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate consumer pact
        working-directory: frontend
        run: |
          npm ci
          npm run test:pact

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify provider against the consumer pact
        working-directory: backend
        run: mvn -B test -Dtest=PactProviderVerificationTest
