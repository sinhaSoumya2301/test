# See SPEC.md "Deployment Strategy" and docs/adr/0005-github-actions-explicit-deploy.md.
# Requires repo secrets: RENDER_DEPLOY_HOOK, BACKEND_HEALTH_URL (e.g. https://<service>.onrender.com/actuator/health).
name: CD - Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/cd-backend.yml"

concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, push, deploy, smoke-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image (tagged latest + git SHA — see SPEC.md "Rollback Strategy")
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for the new deploy to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ secrets.BACKEND_HEALTH_URL }}" | grep -q '"status":"UP"'; then
              echo "Backend healthy."
              exit 0
            fi
            echo "Waiting for backend to become healthy (attempt $i/30)..."
            sleep 10
          done
          echo "::error::Backend did not report healthy within the timeout." >&2
          exit 1
